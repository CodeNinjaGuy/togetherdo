name: togetherdo
description: "Eine professionelle Todo-App mit Einkaufslisten und Echtzeit-Updates"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+10

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # UI & Icons (Schriften liegen als Assets unter assets/fonts/)
  flutter_svg: ^2.2.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  cloud_functions: ^5.6.1
  firebase_messaging: ^15.2.9

  


  # Local Storage
  shared_preferences: ^2.5.3

  # Date & Time
  intl: ^0.20.2
  timezone: ^0.10.1

  # Image Handling
  image_picker: ^1.1.2

  # Navigation
  go_router: ^16.0.0

  # Utils
  uuid: ^4.5.1
  crypto: ^3.0.3
  flutter_local_notifications: ^19.3.0
  image: ^4.12.0
  url_launcher: ^6.3.3
  in_app_review: ^2.0.12

  # Barcode-Scanner und Produktsuche (Open Food Facts)
  mobile_scanner: ^7.4.2
  http: ^1.6.0

  # Spracheingabe (Erkennung auf dem Gerät/System)
  speech_to_text: ^7.5.0

  # Anhänge an Aufgaben, Terminen und im Chat (Dokumente wählen, Dateien
  # teilen, Zwischenablage für Downloads)
  file_picker: ^10.3.3
  share_plus: ^12.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # iOS/macOS bleiben vorerst bei CocoaPods (Projekt ist nicht auf
  # Swift Package Manager umgestellt).
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Gebündelte Schriften (keine Netzladung zur Laufzeit). Lizenzen:
  # assets/fonts/LICENSE-*.txt (SIL OFL 1.1, Roboto Mono: Apache 2.0).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-800.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-800.ttf
          weight: 800
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodePro/SourceCodePro-400.ttf
          weight: 400
        - asset: assets/fonts/SourceCodePro/SourceCodePro-500.ttf
          weight: 500
        - asset: assets/fonts/SourceCodePro/SourceCodePro-600.ttf
          weight: 600
        - asset: assets/fonts/SourceCodePro/SourceCodePro-700.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron/Orbitron-700.ttf
          weight: 700
        - asset: assets/fonts/Orbitron/Orbitron-800.ttf
          weight: 800
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico/Pacifico-400.ttf
          weight: 400
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono/SpaceMono-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono/SpaceMono-700.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-800.ttf
          weight: 800
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway/Raleway-400.ttf
          weight: 400
        - asset: assets/fonts/Raleway/Raleway-500.ttf
          weight: 500
        - asset: assets/fonts/Raleway/Raleway-600.ttf
          weight: 600
        - asset: assets/fonts/Raleway/Raleway-700.ttf
          weight: 700
        - asset: assets/fonts/Raleway/Raleway-800.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora/Lora-700.ttf
          weight: 700
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide/Audiowide-400.ttf
          weight: 400
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-500.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono/RobotoMono-700.ttf
          weight: 700
